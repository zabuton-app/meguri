name: Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:
  # build.yml runs these checks before it builds a release.
  workflow_call:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
# Called from build.yml, github.workflow is the caller's name: a release build
# run by hand on main does not cancel, nor get cancelled by, the tests of a
# push to main; and a release build's checks are never cancelled, so a second
# build of the same ref waits instead of silently skipping the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'Test' }}

# The checks run as parallel jobs, so the wall-clock time is bound by the
# slowest one (E2E) rather than the sum of all steps. Each job runs its own
# `npm ci`.
#
# All jobs pin the image: the core suite and E2E run Electron, and the Electron
# binary dynamically links GUI libs (libnss3 / gtk / gbm / asound …) that the
# GitHub ubuntu runner already provides via its preinstalled browsers. The
# renderer and lint jobs do not need Electron but use the same image to keep
# the jobs alike.
#
# Keep node-version the same in every job and in build.yml (see engines.node in
# package.json).
jobs:
  core:
    name: Type check and core tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Keep in sync with engines.node in package.json; react-router v8 needs 22.22+.
          node-version: 22.22.x
          cache: npm

      # postinstall (electron-builder install-app-deps) prepares better-sqlite3 for Electron,
      # the runtime the core tests use via ELECTRON_RUN_AS_NODE.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Electron-as-Node, better-sqlite3 against in-memory SQLite.
      - name: Run core tests
        run: npm run test:core

  renderer:
    name: Renderer tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Plain Node + jsdom.
      - name: Run renderer tests
        run: npm run test:renderer

  lint:
    name: Lint and format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.x
          cache: npm

      # Linting reads the sources and the installed type declarations only, so
      # the install scripts (Electron download, native rebuild) are skipped.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  e2e:
    name: E2E tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # E2E launches the built Electron app, not Playwright's browsers, so there is no
      # `playwright install` step: xvfb comes with the runner image.
      #
      # Ubuntu 24.04 restricts unprivileged user namespaces; Electron needs this sysctl.
      # Builds, then runs under Xvfb pinned to X11 (same as local runs).
      - name: Run E2E tests
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm run test:e2e:headless
