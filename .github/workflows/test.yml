name: Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:
  # build.yml runs these checks before it builds a release.
  workflow_call:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
# Called from build.yml, github.workflow is the caller's name: a release build
# run by hand on main does not cancel, nor get cancelled by, the tests of a
# push to main; and a release build's checks are never cancelled, so a second
# build of the same ref waits instead of silently skipping the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'Test' }}

# The checks run as parallel jobs, so the wall-clock time is bound by the
# slowest one (E2E) rather than the sum of all steps. Each job runs its own
# `npm ci`.
#
# All jobs pin the image: the core suite and E2E run Electron, and the Electron
# binary dynamically links GUI libs (libnss3 / gtk / gbm / asound …) that the
# GitHub ubuntu runner already provides via its preinstalled browsers. The
# renderer and lint jobs do not need Electron but use the same image to keep
# the jobs alike. `core-macos` and `core-windows` are the jobs off Ubuntu.
#
# Keep node-version the same in every job and in build.yml (see engines.node in
# package.json), and the macOS runner the same as the mac build in build.yml.
# build.yml builds Windows on windows-latest, which windows-2025 is today;
# pinned here so a runner rollover cannot change what the tests ran on.
jobs:
  core:
    name: Type check and core tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Keep in sync with engines.node in package.json; react-router v8 needs 22.22+.
          node-version: 22.22.x
          cache: npm

      # postinstall (electron-builder install-app-deps) prepares better-sqlite3 for Electron,
      # the runtime the core tests use via ELECTRON_RUN_AS_NODE.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Electron-as-Node, better-sqlite3 against in-memory SQLite.
      - name: Run core tests
        run: npm run test:core

  # Core tests that only make sense on macOS (`skipIf(process.platform !==
  # "darwin")`) are skipped on Ubuntu, so they run here. Only the core suite
  # has such tests, so the other checks stay on Ubuntu only.
  core-macos:
    name: Core tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run core tests
        run: npm run test:core

  # The one Windows job. The core suite is where the platform shows through —
  # rel_path separators, CRLF from ffprobe, file locking, the symlink privilege
  # (#297) — and a Windows installer is built, so it is worth a check that the
  # build matrix alone would not give. The runner is an administrator, so the
  # symlink cases CAN_SYMLINK skips on an ordinary local machine run here.
  core-windows:
    name: Core tests (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run core tests
        run: npm run test:core

  renderer:
    name: Renderer tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Plain Node + jsdom.
      - name: Run renderer tests
        run: npm run test:renderer

  lint:
    name: Lint and format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.x
          cache: npm

      # Linting reads the sources and the installed type declarations only, so
      # the install scripts (Electron download, native rebuild) are skipped.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  e2e:
    name: E2E tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # E2E launches the built Electron app, not Playwright's browsers, so there is no
      # `playwright install` step: xvfb comes with the runner image.
      #
      # Ubuntu 24.04 restricts unprivileged user namespaces; Electron needs this sysctl.
      # Builds, then runs pinned to X11 with one Xvfb display per worker (same as local runs).
      - name: Run E2E tests
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm run test:e2e:headless
