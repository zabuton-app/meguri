name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # A release is built only from a commit that passes the same checks as a pull
  # request (#289).
  test:
    uses: ./.github/workflows/test.yml
    # Read only, whatever the repository's default token permissions become:
    # the checks run npm install scripts.
    permissions:
      contents: read

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            args: --linux
          - os: windows-latest
            platform: win
            arch: x64
            args: --win --x64
          # Intel mac (--mac --x64) was dropped: the macos-13 x64 runners are
          # being retired and queue for hours. If it is ever needed again,
          # cross-build it from an arm64 runner instead.
          - os: macos-15
            platform: mac-arm64
            arch: arm64
            args: --mac --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Keep in sync with engines.node in package.json; react-router v8 needs 22.22+.
          node-version: 22.22.x
          cache: npm

      # postinstall (electron-builder install-app-deps) prepares better-sqlite3 for Electron.
      # @zabuton-app/ffmpeg-binaries downloads the binaries of a SINGLE arch at install
      # time based on npm_config_arch || process.arch, so we pin npm_config_arch to the
      # electron-builder target arch to guarantee the bundled binaries match (e.g. avoids an
      # x64-under-Rosetta Node fetching the wrong arch).
      - name: Install dependencies
        run: npm ci
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}

      - name: Build (main / preload / renderer)
        run: npm run build

      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple certificate, so regular macOS signing / notarization is
          # skipped. Left as-is, electron-builder's repackaging invalidates the
          # Electron binaries' signatures and Gatekeeper rejects the app as
          # "damaged" with no way to open it, so the afterPack hook
          # (scripts/mac-adhoc-sign.mjs) ad-hoc signs the bundle to restore a
          # valid signature.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meguri-${{ matrix.platform }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.appx
            release/*.dmg
            release/*.zip
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
