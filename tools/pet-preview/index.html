<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet preview</title>
    <style>
      :root {
        --light-bg: #f6efe0;
        --dark-bg: #1d2021;
        --ink: #3c3836;
        --muted: #7c6f64;
        --line: #d5c4a1;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        font:
          14px/1.5 system-ui,
          sans-serif;
        color: var(--ink);
        background: #ebe3d0;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
      }
      label {
        margin-right: 16px;
      }
      .controls {
        margin-bottom: 24px;
      }
      .state {
        margin-bottom: 20px;
        padding: 12px 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbf7ee;
      }
      .state h2 {
        margin: 0 0 8px;
        font-size: 15px;
      }
      .state h2 small {
        margin-left: 8px;
        font-weight: normal;
        color: var(--muted);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: flex-end;
      }
      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 8px;
        border-radius: 6px;
      }
      .stage.light {
        background: var(--light-bg);
      }
      .stage.dark {
        background: var(--dark-bg);
        color: #a89984;
      }
      .stage span {
        font-size: 11px;
      }
      .frames {
        margin-top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .frames .stage {
        padding: 4px;
      }
      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>Zabuton pet — frame preview</h1>
    <p>
      Every state animated at ×2 / ×3 / ×4 on light and dark backgrounds,
      followed by its individual frames. Rendered with the app's own grid → SVG
      conversion.
    </p>
    <div class="controls">
      <label><input type="checkbox" id="frames" checked /> Show frames</label>
      <label><input type="checkbox" id="pause" /> Pause</label>
    </div>
    <main id="states"></main>
    <script type="module" src="./main.mjs"></script>
  </body>
</html>
